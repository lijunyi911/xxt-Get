<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>学习通刷课助手</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar" id="titlebar">
    <span class="dot"></span>
    <span class="title">学习通刷课</span>
    <div class="win-btns">
      <button class="theme-btn" id="btnTheme" title="切换主题（浅色/深色/跟随系统）">跟随系统</button>
      <button class="wbtn" id="btnMax" title="最大化 / 还原">□</button>
      <button class="wbtn" id="btnMin" title="最小化">—</button>
      <button class="wbtn close" id="btnClose" title="关闭">✕</button>
    </div>
  </div>

  <div class="body">
    <div class="section courses">
      <div class="row">
        <button id="btnLoad" class="primary">读取我的课程</button>
        <button id="btnAll" class="mini" disabled>全选</button>
        <span class="hint" id="loadHint"></span>
      </div>
      <div class="search-row">
        <input id="courseSearch" type="text" placeholder="搜索课程…" />
      </div>
      <div id="courseList" class="course-list">
        <div class="empty">点「读取我的课程」加载列表</div>
      </div>
    </div>

    <div class="section speed">
      <div class="label">倍速</div>
      <div class="speed-row" id="speedRow">
        <button class="spd" data-speed="0.5">0.5x</button>
        <button class="spd" data-speed="1">1x</button>
        <button class="spd" data-speed="1.5">1.5x</button>
        <button class="spd active" data-speed="2">2x</button>
      </div>
      <div class="label" style="margin-top:10px;">文档停留 <span id="docDwellVal">30</span> 秒</div>
      <div class="dwell-row">
        <input type="range" id="docDwellRange" min="5" max="120" step="1" value="30" />
        <input type="number" id="docDwellNum" min="1" max="300" step="1" value="30" />
      </div>
    </div>

    <div class="section actions">
      <div class="row">
        <button id="btnStart" class="primary">开始刷课</button>
        <button id="btnStop" class="danger" disabled>停止</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <button id="btnClear" class="ghost">清除断点重刷</button>
      </div>
    </div>

    <div class="section status">
      <div class="status-line"><span class="st-label">状态</span><span id="stage">待启动</span></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="stat-line">
        <span>课程 <b id="stCourse">0/0</b></span>
        <span>完成 <b id="stDone">0</b></span>
        <span>跳过 <b id="stSkip">0</b></span>
        <span>测验 <b id="stQuiz">0</b></span>
        <span>失败 <b id="stFail">0</b></span>
        <span>今日 <b id="stDaily">0</b>/<span id="stLimit">240</span>分</span>
      </div>
      <div class="progress daily"><div class="bar" id="dailyBar"></div></div>
      <div class="stat-line remain-line"><span id="stRemain"></span></div>
    </div>

    <div class="section log-wrap">
      <div class="log-head">
        <span>运行日志</span>
        <span class="log-tools">
          <label class="log-auto"><input type="checkbox" id="logAuto" checked /> 自动</label>
          <select id="logFilter" class="log-filter">
            <option value="all">全部</option>
            <option value="warn">警告</option>
            <option value="error">错误</option>
          </select>
          <button id="btnCopyLog" class="mini" title="复制日志">复制</button>
          <button id="btnClearLog" class="mini" title="清空日志">清空</button>
          <button id="btnExportLog" class="mini" title="导出日志到文件">导出</button>
        </span>
      </div>
      <div id="log" class="log"></div>
    </div>
  </div>

  <div id="cursor-glow"></div>

  <div class="theme-pop" id="themePop">
    <button data-mode="light">浅色</button>
    <button data-mode="dark">深色</button>
    <button data-mode="system">跟随系统</button>
    <div class="theme-sep"></div>
    <div class="theme-opt">
      <span>字号</span>
      <button data-font="12">小</button>
      <button data-font="13" class="active">中</button>
      <button data-font="15">大</button>
    </div>
    <div class="theme-opt">
      <label><input type="checkbox" id="optCompact" /> 紧凑</label>
      <label><input type="checkbox" id="optAnim" checked /> 动画</label>
    </div>
    <div class="theme-sep"></div>
    <div class="theme-opt">
      <span>每日上限</span>
      <select id="optDailyLimit" class="log-filter">
        <option value="0" selected>不限</option>
        <option value="120">120分</option>
        <option value="180">180分</option>
        <option value="240">240分</option>
        <option value="300">300分</option>
        <option value="500">500分</option>
      </select>
    </div>
    <div class="theme-opt">
      <button id="btnResetOpt" class="mini" style="flex:1">恢复默认</button>
      <button id="btnAbout" class="mini" style="flex:1">关于</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
