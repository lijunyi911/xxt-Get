<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>学习通刷课助手</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar" id="titlebar">
    <span class="dot"></span>
    <span class="title">学习通刷课</span>
    <div class="win-btns">
      <button class="theme-btn" id="btnTheme" title="切换主题">跟随系统</button>
      <button class="theme-btn" id="btnSettings" title="设置">设置</button>
      <button class="wbtn" id="btnMax" title="最大化 / 还原">
        <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="wbtn" id="btnMin" title="最小化">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="wbtn close" id="btnClose" title="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>

  <div class="body">
    <div class="left-col">
    <div class="section courses">
      <div class="row">
        <button id="btnLoad" class="primary">读取我的课程</button>
        <button id="btnAll" class="mini" disabled>全选</button>
        <button id="btnSort" class="mini" disabled title="按名称排序">排序</button>
        <span class="hint" id="loadHint"></span>
      </div>
      <div class="search-row">
        <input id="courseSearch" type="text" placeholder="搜索课程…" />
      </div>
      <div id="courseList" class="course-list">
        <div class="empty">暂无课程<br />点上方「读取我的课程」加载</div>
      </div>
    </div>

    <div class="section control">
      <div class="label">倍速</div>
      <div class="speed-row" id="speedRow">
        <button class="spd" data-speed="0.5">0.5x</button>
        <button class="spd" data-speed="1">1x</button>
        <button class="spd" data-speed="1.5">1.5x</button>
        <button class="spd active" data-speed="2">2x</button>
      </div>
      <div class="row" style="margin-top:10px;">
        <button id="btnStart" class="primary">开始刷课</button>
        <button id="btnPause" class="mini" disabled>暂停</button>
        <button id="btnStop" class="danger" disabled>停止</button>
        <button id="btnRetry" class="mini" style="display:none;">重试</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <button id="btnClear" class="ghost">清除断点重刷</button>
        <button id="btnRefresh" class="ghost" title="卡住时重置浏览器并重新读取">刷新</button>
      </div>
    </div>

    <div class="section status">
      <div class="status-line"><span class="st-label">状态</span><span id="stage">准备就绪</span></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="stat-grid">
        <div class="stat-cell"><span>课程</span><b id="stCourse">0/0</b></div>
        <div class="stat-cell"><span>完成</span><b id="stDone">0</b></div>
        <div class="stat-cell"><span>跳过</span><b id="stSkip">0</b></div>
        <div class="stat-cell"><span>测验</span><b id="stQuiz">0</b></div>
        <div class="stat-cell"><span>失败</span><b id="stFail">0</b></div>
        <div class="stat-cell"><span>用时</span><b id="stRunTime">0:00</b></div>
      </div>
      <div class="daily-line">
        <span>今日 <b id="stDaily">0</b>/<span id="stLimit">∞</span> 分钟</span>
        <span id="stRemain"></span>
      </div>
      <div class="progress daily"><div class="bar" id="dailyBar"></div></div>
    </div>

    </div>

    <div class="section log-wrap">
      <div class="log-head">
        <span>运行日志</span>
        <span class="log-tools">
          <label class="log-auto"><input type="checkbox" id="logAuto" checked /> 自动</label>
          <label class="log-auto"><input type="checkbox" id="logReverse" /> 倒序</label>
          <input id="logSearch" class="log-search" type="text" placeholder="搜索" />
          <select id="logFilter" class="log-filter">
            <option value="all">全部</option>
            <option value="warn">警告</option>
            <option value="error">错误</option>
          </select>
          <button id="btnCopyLog" class="mini" title="复制日志">复制</button>
          <button id="btnClearLog" class="mini" title="清空日志">清空</button>
          <button id="btnExportLog" class="mini" title="导出日志到文件">导出</button>
        </span>
      </div>
      <div id="log" class="log"></div>
    </div>
  </div>

  <div id="cursor-glow"></div>

  <div class="theme-pop" id="themePop">
    <button data-mode="light">浅色</button>
    <button data-mode="dark">深色</button>
    <button data-mode="system">跟随系统</button>
  </div>

  <div class="settings-mask" id="settingsMask">
    <div class="settings-panel">
      <div class="settings-head">
        <span>设置</span>
        <button class="wbtn close set-close" id="btnSettingsClose">✕</button>
      </div>

      <div class="settings-body">
        <div class="set-item">
          <div class="set-label">文档停留</div>
          <div class="dwell-row">
            <input type="range" id="docDwellRange" min="1" max="60" step="0.1" value="30" />
            <input type="number" id="docDwellNum" min="0.1" max="99999" step="0.1" value="30" />
            <span class="set-unit"><span id="docDwellVal">30</span> 秒</span>
          </div>
        </div>

        <div class="set-item">
          <div class="set-label">每日上限</div>
          <select id="optDailyLimit" class="set-select">
            <option value="0" selected>不限</option>
            <option value="120">120 分钟</option>
            <option value="180">180 分钟</option>
            <option value="240">240 分钟</option>
            <option value="300">300 分钟</option>
            <option value="500">500 分钟</option>
          </select>
        </div>

        <div class="set-item">
          <div class="set-label">节奏</div>
          <div class="set-row">
            <button class="set-btn" data-pace="slow">慢</button>
            <button class="set-btn active" data-pace="normal">中</button>
            <button class="set-btn" data-pace="fast">快</button>
          </div>
        </div>

        <div class="set-item">
          <div class="set-label">字号</div>
          <div class="set-row">
            <button class="set-btn" data-font="12">小</button>
            <button class="set-btn" data-font="13">中</button>
            <button class="set-btn" data-font="15">大</button>
          </div>
        </div>

        <div class="set-item">
          <div class="set-label">主题色</div>
          <div class="set-row" id="accentRow">
            <button class="color-dot active" data-accent="orange" style="--dot:#ff8c1a" title="橙"></button>
            <button class="color-dot" data-accent="blue" style="--dot:#3d9bff" title="蓝"></button>
            <button class="color-dot" data-accent="green" style="--dot:#2fbf71" title="绿"></button>
            <button class="color-dot" data-accent="purple" style="--dot:#a06bff" title="紫"></button>
            <div class="color-wheel-wrap" id="colorWheel" title="自定义颜色（点击展开调色板）">
              <div class="color-wheel-ring"></div>
            </div>
          </div>

          <div class="color-panel" id="colorPanel">
            <div class="color-panel-head">
              <div class="color-preview" id="colorPreview"></div>
              <input type="text" id="hexInput" class="hex-input" value="#ff8c1a" maxlength="7" spellcheck="false" />
            </div>
            <div class="hue-slider">
              <input type="range" id="hueRange" min="0" max="360" step="1" value="30" />
            </div>
            <div class="sl-row">
              <span>饱和</span>
              <input type="range" id="satRange" min="0" max="100" step="1" value="90" />
            </div>
            <div class="sl-row">
              <span>亮度</span>
              <input type="range" id="lightRange" min="0" max="100" step="1" value="50" />
            </div>
          </div>
        </div>

        <div class="set-item">
          <div class="set-label">圆角</div>
          <div class="set-row">
            <button class="set-btn" data-radius="6">小</button>
            <button class="set-btn active" data-radius="8">中</button>
            <button class="set-btn" data-radius="14">大</button>
          </div>
        </div>

        <div class="set-item">
          <div class="set-label">断点数据</div>
          <div class="set-row">
            <span class="set-unit" id="stateCount">---</span>
            <button id="btnExportState" class="mini">导出断点</button>
          </div>
        </div>

        <div class="set-item">
          <div class="set-label">最近 7 天学习记录</div>
          <div id="weekTotal" class="set-unit" style="margin-bottom:6px;"></div>
          <div id="historyList" class="history-list"><div class="empty">暂无记录</div></div>
          <button id="btnExportHistory" class="mini" style="margin-top:8px;">导出统计 CSV</button>
        </div>

        <div class="set-item">
          <div class="set-label">窗口</div>
          <div class="set-row">
            <label class="set-check"><input type="checkbox" id="optOnTop" checked /> 置顶</label>
          </div>
          <div class="opacity-row">
            <span>透明度</span>
            <input type="range" id="optOpacity" min="0.5" max="1" step="0.05" value="1" />
            <span id="opacityVal">100%</span>
          </div>
        </div>

        <div class="set-item">
          <div class="set-label">显示</div>
          <div class="set-row">
            <label class="set-check"><input type="checkbox" id="optCompact" /> 紧凑模式</label>
            <label class="set-check"><input type="checkbox" id="optAnim" checked /> 动画效果</label>
            <label class="set-check"><input type="checkbox" id="optMuted" checked /> 静音播放</label>
            <label class="set-check"><input type="checkbox" id="optSound" checked /> 提示音</label>
          </div>
        </div>
      </div>

      <div class="settings-foot">
        <button id="btnExportSettings" class="ghost">导出设置</button>
        <button id="btnImportSettings" class="ghost">导入设置</button>
      </div>
      <div class="settings-foot">
        <button id="btnResetOpt" class="ghost">恢复默认</button>
        <button id="btnAbout" class="ghost">关于</button>
      </div>
    </div>
  </div>

  <div class="confirm-mask" id="confirmMask">
    <div class="confirm-box">
      <div class="confirm-msg" id="confirmMsg"></div>
      <div class="confirm-btns">
        <button id="confirmCancel">取消</button>
        <button id="confirmOk" class="primary">确定</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
